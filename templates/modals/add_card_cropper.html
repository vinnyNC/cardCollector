<div id="cropModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-gray-900 bg-opacity-75">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="relative bg-white dark:bg-gray-800 rounded-lg p-4 w-full max-w-lg sm:max-w-2xl mx-auto my-8">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium dark:text-white">Crop Image</h3>
                <button onclick="closeCropModal()"
                        class="text-2xl text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                    &times;
                </button>
            </div>
            <div class="mb-4 overflow-hidden">
                <div id="cropperContainer" class="relative w-full" style="max-height: 60vh;">
                    <img id="imageToCrop" class="w-full h-auto touch-pinch-zoom" alt="Image to crop">
                </div>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeCropModal()"
                        class="px-4 py-2 bg-gray-300 dark:bg-gray-600 text-gray-800 dark:text-white rounded hover:bg-gray-400 dark:hover:bg-gray-700 text-sm sm:text-base">
                    Cancel
                </button>
                <button onclick="saveCroppedImage()"
                        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm sm:text-base">Save
                </button>
            </div>
        </div>
    </div>
</div>
