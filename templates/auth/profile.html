{% extends '_base.html' %}
{% block content %}
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6 dark:text-white">Profile</h1>
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4 dark:text-white">{{ user.username }}</h2>
            <p class="text-gray-700 dark:text-gray-300">Email: {{ user.email }}</p>
            <p class="text-gray-700 dark:text-gray-300">Member since: {{ user.date_joined|date:"F j, Y" }}</p>
        </div>
    </div>
{% endblock %}
