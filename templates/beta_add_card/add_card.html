{% load compress %}
<!-- templates/add_card.html -->
{% load static %}

<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ siteName }} - Add Card</title>
    <link rel="icon" type="image/png" href="{% static 'favicon.ico' %}"/>
    <script src="https://unpkg.com/@tailwindcss/browser@4.0.12/dist/index.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.12/dist/cropper.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.12/dist/cropper.min.js"></script>

    <style>
        /* Flowbite fixes */
        @layer base {
            button,
            [role='button'] {
                cursor: pointer;
            }

            button:disabled,
            [role='button']:disabled {
                cursor: default;
            }
        }
    </style>
</head>
<body class="bg-gray-900">
<div class="antialiased bg-gray-50 dark:bg-gray-900">
    <!-- Navbar -->
    {% include "nav/header.html" %}

    <!-- Main content -->
    <main class="p-4 md:ml-auto h-auto pt-20">
        <div class="container mx-auto px-4 py-8">
            <h1 class="text-4xl font-bold mb-6 dark:text-white text-center">Add Card to Collection</h1>

            <!-- Stepper -->
            <div class="mb-8">
                <ol class="flex items-center justify-center w-full p-3 space-x-2 text-sm font-medium text-center text-gray-500 bg-white border border-gray-200 rounded-lg shadow-xs dark:text-gray-400 sm:text-base dark:bg-gray-800 dark:border-gray-700 sm:p-4 sm:space-x-4 rtl:space-x-reverse">
                    <li class="flex items-center justify-center text-blue-600 dark:text-blue-500">
                        <span class="flex items-center justify-center w-5 h-5 me-2 text-xs border border-blue-600 rounded-full shrink-0 dark:border-blue-500">1</span>
                        Personal Info

                        <svg class="w-3 h-3 ms-2 sm:ms-4 rtl:rotate-180" aria-hidden="true"
                             xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 12 10">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="m7 9 4-4-4-4M1 9l4-4-4-4"></path>
                        </svg>
                    </li>
                    <li class="flex items-center justify-center">
                        <span class="flex items-center justify-center w-5 h-5 me-2 text-xs border border-gray-500 rounded-full shrink-0 dark:border-gray-400">2</span>
                        Account Info

                        <svg class="w-3 h-3 ms-2 sm:ms-4 rtl:rotate-180" aria-hidden="true"
                             xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 12 10">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="m7 9 4-4-4-4M1 9l4-4-4-4"></path>
                        </svg>
                    </li>
                    <li class="flex items-center justify-center">
                        <span class="flex items-center justify-center w-5 h-5 me-2 text-xs border border-gray-500 rounded-full shrink-0 dark:border-gray-400">3</span>
                        Review
                    </li>
                </ol>
            </div>

            <form id="sportsCardForm" enctype="multipart/form-data" method="post" class="space-y-8" autocomplete="off">
                {% csrf_token %}

            </form>
            <!-- Form Navigation Button -->
            <div class="grid gap-6 md:grid-cols-2">
                <button type="button" id="btnPrev"
                        class="w-full bg-blue-600 text-white p-2.5 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800">
                    Previous
                </button>
                <button type="button" id="btnNext"
                        class="w-full bg-blue-600 text-white p-2.5 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800">
                    Next
                </button>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
<script src="{% static 'js/addCard_beta.js' %}"></script>

</body>
</html>
