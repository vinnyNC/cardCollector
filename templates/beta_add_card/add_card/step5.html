<!-- Storage Information -->
<div class="space-y-6 text-gray-900 dark:text-white">
    <h2 class="text-3xl font-semibold tracking-tight">Card Storage</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">
        Specify how and where your card is stored. This information helps you keep track of your collection.
    </p>

    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
        <h3 class="text-xl font-semibold mb-4">Storage Location</h3>
        
        <div class="mb-6">
            <label for="storageLocation"
                   class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Storage Location (Box)</label>
            <input type="text" id="storageLocation" name="storageLocation"
                   class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                   placeholder="e.g., Box 1, Row 3">
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Specify where this card is stored in your collection (e.g., "Box 2, Shelf 3" or "Display Case")</p>
        </div>
        
        <h3 class="text-xl font-semibold mb-4 mt-8">Holder Type</h3>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div class="flex items-center">
                <input id="holderTypeRaw" type="checkbox" name="holderTypeRaw" value="Raw"
                       class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 dark:bg-gray-700 dark:border-gray-600">
                <label for="holderTypeRaw"
                       class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Raw</label>
            </div>
            <div class="flex items-center">
                <input id="holderTypePennySleeve" type="checkbox" name="holderTypePennySleeve"
                       value="Penny Sleeve"
                       class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 dark:bg-gray-700 dark:border-gray-600">
                <label for="holderTypePennySleeve"
                       class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Penny Sleeve</label>
            </div>
            <div class="flex items-center">
                <input id="holderTypeTopLoader" type="checkbox" name="holderTypeTopLoader" value="Top Loader"
                       class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 dark:bg-gray-700 dark:border-gray-600">
                <label for="holderTypeTopLoader"
                       class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Top Loader</label>
            </div>
            <div class="flex items-center">
                <input id="holderTypeMagnetic" type="checkbox" name="holderTypeMagnetic" value="Magnetic"
                       class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 dark:bg-gray-700 dark:border-gray-600">
                <label for="holderTypeMagnetic"
                       class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Magnetic</label>
            </div>
            <div class="flex items-center">
                <input id="holderTypeGraded" type="checkbox" name="holderTypeGraded" value="Graded Slab"
                       class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 dark:bg-gray-700 dark:border-gray-600">
                <label for="holderTypeGraded"
                       class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Graded Slab</label>
            </div>
            <div class="flex items-center">
                <input id="holderTypeOther" type="checkbox" name="holderTypeOther" value="Other"
                       class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 dark:bg-gray-700 dark:border-gray-600"
                       onclick="toggleField('otherHolderTypeContainer', this)">
                <label for="holderTypeOther"
                       class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Other</label>
            </div>
        </div>
        
        <!-- Other Holder Type Field -->
        <div id="otherHolderTypeContainer" class="hidden mt-4">
            <label for="otherHolderTypeDetail"
                   class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Specify Other Holder Type</label>
            <input type="text" id="otherHolderTypeDetail" name="otherHolderTypeDetail"
                   class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                   placeholder="e.g., Team Bag, Screw-down, etc.">
        </div>
        
        <!-- Additional Storage Notes -->
        <div class="mt-8">
            <label for="storageNotes" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                Storage Notes
            </label>
            <textarea id="storageNotes" name="storageNotes" rows="3"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                      placeholder="Any additional notes about how this card is stored"></textarea>
        </div>
    </div>
</div>

<script>
    // Toggle field visibility
    function toggleField(containerId, checkbox) {
        const container = document.getElementById(containerId);
        if (checkbox.checked) {
            container.classList.remove('hidden');
        } else {
            container.classList.add('hidden');
        }
    }
</script>
